name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Foundation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Migration Atomicity
        run: node tests/migration_atomicity_test.mjs

      - name: Foundation Test
        run: node tests/foundation_test.mjs

      - name: Storage Cutover
        run: node tests/storage_cutover_test.mjs

      - name: Core Product
        run: node tests/core_product_test.mjs

      - name: Reconstruction
        run: node tests/reconstruction_test.mjs

      - name: Core Loop
        run: node tests/core_loop_test.mjs

      - name: Reply Clean
        run: node tests/reply_clean_test.mjs

      - name: Chat Send
        run: node tests/chat_send_test.mjs

      - name: Theme Tokens
        run: node tests/theme_tokens_test.mjs

      - name: Ambient Policy
        run: node tests/ambient_policy_test.mjs

      - name: V1.1 Context
        run: node tests/v1_1_context_test.mjs

      - name: Syntax check (src)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find src -type f -name '*.js' -print0)
