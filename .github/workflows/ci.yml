name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Foundation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Migration Atomicity
        run: node tests/migration_atomicity_test.mjs

      - name: Foundation Test
        run: node tests/foundation_test.mjs

      - name: Storage Cutover
        run: node tests/storage_cutover_test.mjs

      - name: Syntax check (src)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find src -type f -name '*.js' -print0)
