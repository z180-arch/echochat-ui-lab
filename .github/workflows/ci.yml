name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node tests
        run: npm test

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Wave 3A browser verify
        run: node scripts/wave3a_ui_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Wave 3B browser verify
        run: node scripts/wave3b_ui_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Wave 4 browser verify
        run: node scripts/wave4_ui_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Landing CTA browser verify
        run: node scripts/landing_cta_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Continuity UI browser verify
        run: node scripts/continuity_ui_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Moments and Worldbook UI browser verify
        run: node scripts/moments_worldbook_ui_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Storage lifecycle browser verify
        run: node scripts/storage_lifecycle_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Memory and chat lifecycle browser verify
        run: node scripts/memory_chat_lifecycle_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: STT and conversation browser verify
        run: node scripts/stt_conversation_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: First-run experience browser verify
        run: node scripts/first_run_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Chat actions browser verify
        run: node scripts/chat_actions_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Stream paint browser verify
        run: node scripts/stream_paint_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Long chat browser verify
        run: node scripts/long_chat_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Bulk import browser verify
        run: node scripts/bulk_import_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Provider lifecycle browser verify
        run: node scripts/provider_lifecycle_verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
