<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7faf9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EchoChat" />
  <title>EchoChat — 念念不忘，必有回响</title>
  <script>
    window.__errors = [];
    window.onerror = function(msg, url, line, col, err) {
      window.__errors.push({msg, url, line, col, stack: err && err.stack});
      var pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;inset:0;background:#fff;color:#c00;padding:20px;z-index:9999;overflow:auto;white-space:pre-wrap;font-size:13px;';
      pre.textContent = 'ERROR: ' + msg + '\n' + url + ':' + line + ':' + col + '\n\n' + (err && err.stack || '');
      document.body.appendChild(pre);
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.__errors.push({msg: 'unhandledrejection', reason: e.reason});
      var pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;inset:0;background:#fff;color:#c00;padding:20px;z-index:9999;overflow:auto;white-space:pre-wrap;font-size:13px;';
      pre.textContent = 'UNHANDLED: ' + (e.reason && e.reason.message || e.reason) + '\n\n' + (e.reason && e.reason.stack || '');
      document.body.appendChild(pre);
    });
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/layouts.css" />
  <link rel="stylesheet" href="src/styles/responsive.css" />
</head>
<body>
  <!-- Logo 启动动画 (Morning Mint) -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 64 64" width="64" height="64" fill="none">
          <circle cx="32" cy="32" r="30" fill="url(#mintGrad)" opacity="0.15"/>
          <path d="M20 24c0-4 4-8 12-8s12 4 12 8v4c0 8-6 14-12 16-6-2-12-8-12-16v-4z" fill="url(#mintGrad)" opacity="0.9"/>
          <circle cx="26" cy="28" r="2.5" fill="#fff"/>
          <circle cx="38" cy="28" r="2.5" fill="#fff"/>
          <path d="M27 36c2 2 8 2 10 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="mintGrad" x1="20" y1="16" x2="44" y2="48">
              <stop offset="0%" stop-color="#5eead4"/>
              <stop offset="100%" stop-color="#14b8a6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="splash-wordmark">EchoChat</div>
      <div class="splash-tagline">念念不忘，必有回响</div>
    </div>
  </div>
  <div id="app">
    <!-- 应用内容由 main.js 渲染 -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- 配置文件（用户复制 config.example.js 为 config.js） -->
  <script src="config.js"></script>

  <!-- 主应用入口（ES Module） -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
